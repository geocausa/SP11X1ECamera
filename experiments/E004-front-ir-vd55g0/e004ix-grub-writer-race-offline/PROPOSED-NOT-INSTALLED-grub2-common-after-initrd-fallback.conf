# E004ix OFFLINE PROPOSAL ONLY. Never installed by this experiment.
# grub2-common currently writes /boot/grub/grubenv concurrently with
# grub-initrd-fallback.service, which also writes the same block.
# This proposed drop-in would serialize the former AFTER the latter.
# Its actual system/boot impact must be separately validated before deployment.
[Unit]
Wants=grub-initrd-fallback.service
After=grub-initrd-fallback.service
