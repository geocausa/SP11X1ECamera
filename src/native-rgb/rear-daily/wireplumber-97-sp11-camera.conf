# SP11: applications see only the "SP11 Rear Camera" webcam bridge.
# The raw Qualcomm camss nodes are driven exclusively by sp11-webcam.
wireplumber.profiles = {
  main = {
    monitor.libcamera = disabled
  }
}
monitor.v4l2.rules = [
  {
    matches = [
      { device.name = "~v4l2_device.platform-acb7000.isp*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
